<main class="min-h-screen bg-[#050816] text-white flex items-center justify-center px-6 py-10">
  <section class="w-full max-w-[460px] rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-[0_30px_120px_rgba(2,6,23,0.6)] p-8">
    <h1 class="text-2xl font-bold tracking-tight mb-2">Recuperar contraseña</h1>
    <p class="text-sm text-slate-400 mb-6">Si el correo existe, enviaremos un enlace temporal para restablecer el acceso.</p>

    @if (error()) {
      <div class="mb-5 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200">{{ error() }}</div>
    }
    @if (info()) {
      <div class="mb-5 rounded-xl border border-cyan-500/30 bg-cyan-500/10 px-4 py-3 text-sm text-cyan-100">{{ info() }}</div>
    }

    <form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block">
        <span class="block text-[13px] font-semibold text-slate-200 mb-2">Correo</span>
        <input
          type="email"
          formControlName="email"
          class="w-full h-11 rounded-xl border border-white/10 bg-slate-950/70 px-3 text-sm text-white outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20"
        />
      </label>

      <button type="submit" [disabled]="loading()" class="w-full h-11 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-sm font-bold shadow-lg shadow-cyan-500/20 disabled:opacity-60">
        {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
      </button>
      <a routerLink="/login" class="block text-center text-[13px] text-slate-400 hover:text-cyan-300 transition-colors">Volver al login</a>
    </form>
  </section>
</main>

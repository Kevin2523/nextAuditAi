<main class="min-h-screen bg-[#050816] text-white flex items-center justify-center px-6 py-10">
  <section class="w-full max-w-[480px] rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-[0_30px_120px_rgba(2,6,23,0.6)] p-8">
    <h1 class="text-2xl font-bold tracking-tight mb-2">Restablecer contraseña</h1>
    <p class="text-sm text-slate-400 mb-6">Usa el token temporal generado desde recuperación de contraseña.</p>

    @if (error()) {
      <div class="mb-5 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200">{{ error() }}</div>
    }
    @if (message()) {
      <div class="mb-5 rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-100">{{ message() }}</div>
    }

    <form class="grid gap-5" [formGroup]="form" (ngSubmit)="submit()">

      <label class="block">
        <span class="block text-[13px] font-semibold text-slate-200 mb-2">Nueva contraseña</span>
        <input type="password" formControlName="password" class="w-full h-11 rounded-xl border border-white/10 bg-slate-950/70 px-3 text-sm text-white outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20" 
               [class.border-red-500]="form.controls.password.invalid && form.controls.password.touched" />
        
        <ul class="mt-3 grid grid-cols-2 gap-2 text-[12px]">
          <li class="flex items-center gap-1.5 transition-colors" [class]="passwordRules().length ? 'text-emerald-400' : 'text-slate-400'">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline *ngIf="passwordRules().length" points="20 6 9 17 4 12"></polyline>
              <circle *ngIf="!passwordRules().length" cx="12" cy="12" r="10" stroke-width="2"></circle>
            </svg>
            12+ caracteres
          </li>
          <li class="flex items-center gap-1.5 transition-colors" [class]="passwordRules().uppercase ? 'text-emerald-400' : 'text-slate-400'">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline *ngIf="passwordRules().uppercase" points="20 6 9 17 4 12"></polyline>
              <circle *ngIf="!passwordRules().uppercase" cx="12" cy="12" r="10" stroke-width="2"></circle>
            </svg>
            Mayúscula
          </li>
          <li class="flex items-center gap-1.5 transition-colors" [class]="passwordRules().lowercase ? 'text-emerald-400' : 'text-slate-400'">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline *ngIf="passwordRules().lowercase" points="20 6 9 17 4 12"></polyline>
              <circle *ngIf="!passwordRules().lowercase" cx="12" cy="12" r="10" stroke-width="2"></circle>
            </svg>
            Minúscula
          </li>
          <li class="flex items-center gap-1.5 transition-colors" [class]="passwordRules().number ? 'text-emerald-400' : 'text-slate-400'">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline *ngIf="passwordRules().number" points="20 6 9 17 4 12"></polyline>
              <circle *ngIf="!passwordRules().number" cx="12" cy="12" r="10" stroke-width="2"></circle>
            </svg>
            Número
          </li>
          <li class="flex items-center gap-1.5 transition-colors" [class]="passwordRules().special ? 'text-emerald-400' : 'text-slate-400'">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline *ngIf="passwordRules().special" points="20 6 9 17 4 12"></polyline>
              <circle *ngIf="!passwordRules().special" cx="12" cy="12" r="10" stroke-width="2"></circle>
            </svg>
            Símbolo especial
          </li>
        </ul>
      </label>
      <label class="block">
        <span class="block text-[13px] font-semibold text-slate-200 mb-2">Confirmar contraseña</span>
        <input type="password" formControlName="confirmPassword" class="w-full h-11 rounded-xl border border-white/10 bg-slate-950/70 px-3 text-sm text-white outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20" 
               [class.border-red-500]="form.controls.confirmPassword.invalid && form.controls.confirmPassword.touched" />
        @if (form.controls.confirmPassword.invalid && form.controls.confirmPassword.touched) {
          <p class="mt-2 text-[12px] text-red-400">Debes confirmar la contraseña.</p>
        }
      </label>

      <button type="submit" [disabled]="loading()" class="w-full h-11 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-sm font-bold shadow-lg shadow-cyan-500/20 disabled:opacity-60">
        {{ loading() ? 'Actualizando...' : 'Actualizar contraseña' }}
      </button>
      <a routerLink="/login" class="text-center text-[13px] text-slate-400 hover:text-cyan-300 transition-colors">Volver al login</a>
    </form>
  </section>
</main>

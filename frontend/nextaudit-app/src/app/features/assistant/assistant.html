<div class="flex flex-col h-full saas-card bg-white overflow-hidden">
  <!-- Header -->
  <div class="h-16 border-b border-[#E2E8F0] flex items-center justify-between px-6 shrink-0 bg-white shadow-sm z-10">
    <div class="flex items-center gap-3">
      <div class="relative">
        <div class="w-9 h-9 rounded-full bg-primary-100 flex items-center justify-center text-primary-600">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-[#10B981] border-2 border-white"></span>
      </div>
      <div>
        <h2 class="text-[15px] font-bold text-[#0F172A] leading-tight">Asistente de Seguridad Integrado</h2>
        <p class="text-[12px] text-[#64748B]">Orientacion para analisis y seguimiento</p>
      </div>
    </div>
    <button (click)="toggleVoiceEnabled()" [title]="isVoiceEnabled ? 'Desactivar voz del bot' : 'Activar voz del bot'" class="w-9 h-9 rounded-full flex items-center justify-center transition-colors" [class.text-primary-600]="isVoiceEnabled" [class.bg-primary-50]="isVoiceEnabled" [class.text-[#94A3B8]]="!isVoiceEnabled" [class.hover:bg-[#E2E8F0]]="!isVoiceEnabled">
      <svg *ngIf="isVoiceEnabled" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      <svg *ngIf="!isVoiceEnabled" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
    </button>
  </div>

  <!-- Chat Area -->
  <div #scrollArea class="flex-1 overflow-y-auto p-6 space-y-6 bg-[#F8FAFC]">
    <div *ngFor="let msg of messages" class="flex w-full" [class.justify-end]="msg.sender === 'user'">
      <!-- Assistant Message Bubble -->
      <div *ngIf="msg.sender === 'assistant'" class="flex max-w-[80%] items-end gap-3">
        <div class="w-8 h-8 rounded-full bg-white border border-[#E2E8F0] shadow-sm flex items-center justify-center shrink-0 text-primary-600 mb-1">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <div>
          <div class="text-[11px] text-[#94A3B8] ml-1 mb-1">{{msg.time}}</div>

          <div *ngIf="msg.isTyping" class="bg-white border border-[#E2E8F0] shadow-sm rounded-2xl rounded-bl-sm py-3 px-5 text-[#64748B] text-[14px] font-medium">
            {{msg.text}}
          </div>

          <div *ngIf="!msg.isTyping" class="bg-white border border-[#E2E8F0] shadow-sm rounded-2xl rounded-bl-sm py-3 px-5 text-[#334155] text-[14px] leading-relaxed chat-html" [innerHTML]="msg.html || msg.text">
          </div>
        </div>
      </div>

      <!-- User Message Bubble -->
      <div *ngIf="msg.sender === 'user'" class="flex max-w-[75%] items-end gap-3 justify-end">
        <div>
          <div class="text-[11px] text-[#94A3B8] text-right mr-1 mb-1">{{msg.time}}</div>
          <div class="bg-primary-600 text-white shadow-md shadow-primary-600/20 rounded-2xl rounded-br-sm py-2.5 px-5 text-[14px] font-medium">
            {{msg.text}}
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="bg-white border-t border-[#E2E8F0] p-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
    <div class="flex gap-2 mx-auto max-w-[800px] mb-3 overflow-x-auto pb-1 no-scrollbar">
      <button *ngFor="let s of suggestions" (click)="sendMessage(s)" class="shrink-0 text-[12px] font-semibold text-[#475569] bg-[#F1F5F9] hover:bg-[#E2E8F0] px-3 py-1.5 rounded-full transition-colors border border-[#E2E8F0]">
        {{s}}
      </button>
    </div>

    <div class="flex items-end gap-3 mx-auto max-w-[800px] relative rounded-xl border border-[#E2E8F0] bg-[#F8FAFC] shadow-sm focus-within:border-primary-500 focus-within:ring-1 focus-within:ring-primary-500 transition-all p-1.5">
      <button (click)="toggleVoice()" class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 transition-colors" [class.bg-red-50]="isRecording" [class.text-red-500]="isRecording" [class.text-[#94A3B8]]="!isRecording" [class.hover:bg-[#E2E8F0]]="!isRecording" title="Control por Voz Inteligente">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <textarea [(ngModel)]="userInput" (keydown)="handleKeyDown($event)" placeholder="Escribe tu consulta o activa el Control por Voz..." rows="1" class="flex-1 bg-transparent border-none focus:ring-0 py-2.5 px-2 text-[14px] text-[#0F172A] placeholder:text-[#94A3B8] resize-none outline-none leading-normal"></textarea>

      <button (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping" class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
        <svg class="w-4 h-4 ml-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div *ngIf="isRecording" class="text-center mt-2 text-[12px] font-semibold text-red-500 animate-pulse">Escuchando comando de voz...</div>
  </div>
</div>

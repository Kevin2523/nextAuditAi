<div class="saas-card p-6 mb-6">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#10B981] opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-[#10B981]"></span>
      </div>
      <h3 class="font-display text-base font-bold text-[#0F172A] uppercase tracking-wide">Centro de Auditoria - Live Feed</h3>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr>
          <th class="py-3 px-4 text-[12px] font-semibold text-[#64748B] uppercase tracking-wider border-b border-[#E2E8F0]">Hora</th>
          <th class="py-3 px-4 text-[12px] font-semibold text-[#64748B] uppercase tracking-wider border-b border-[#E2E8F0]">Host</th>
          <th class="py-3 px-4 text-[12px] font-semibold text-[#64748B] uppercase tracking-wider border-b border-[#E2E8F0]">Analisis de IA</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-[#E2E8F0]">
        <tr *ngFor="let alert of alerts.alerts()" class="hover:bg-[#F8FAFC] transition-colors">
          <td class="py-3 px-4 text-[13px] font-mono text-[#64748B] whitespace-nowrap">{{ formatDate(alert.receivedAt) }}</td>
          <td class="py-3 px-4 text-[13px] font-semibold text-[#0F172A] whitespace-nowrap">{{ hostName(alert.hostname, alert.deviceId) }}</td>
          <td class="py-3 px-4 text-[13px]">
            <div class="flex items-start gap-2">
              <div class="w-2 h-2 rounded-full mt-1.5 shrink-0"
                   [class]="alert.severity === 'critical' ? 'bg-[#EF4444] shadow-[0_0_8px_rgba(239,68,68,0.6)]' : 'bg-[#0D9488]'">
              </div>
              <span [class]="alert.severity === 'critical' ? 'text-[#DC2626] font-medium' : 'text-[#334155]'">
                {{ alert.message }}
              </span>
            </div>
          </td>
        </tr>
        <tr *ngIf="alerts.alerts().length === 0">
          <td colspan="3" class="py-10 text-center text-[13px] text-[#94A3B8] font-medium">
            Esperando transmisión de datos...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

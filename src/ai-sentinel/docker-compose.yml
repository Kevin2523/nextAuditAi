volumes:
# -----------------------------
# AI_Stack volumes
# Volumenes agregados en el desarrollo
# -----------------------------
  ollama_data:
  postgres_data:
  flowise_data:
  n8n_data:
# -----------------------------
# Fleet Compose volumes
# Los siguientes volumenes son proporcionados por el compose oficial de fleets
# -----------------------------
  mysql:
  redis:
  data:
  logs:
  vulndb:
  instaladores:

services:
##################################  AI_Stack  ###############################################################
# Compose desarrollado
  ollama:
    build:
      context: ./ollama
    container_name: ollama
    environment:
          OLLAMA_MODELS: ${OLLAMA_MODELS}
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  postgres:
    build: ./postgres
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EMBEDDING_SIZE: ${EMBEDDING_SIZE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      PORT: ${FLOWISE_PORT}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA}
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      # Dev local: permite que las tools llamen servicios internos del compose,
      # por ejemplo http://n8n:5678/webhook/...
      HTTP_SECURITY_CHECK: ${FLOWISE_HTTP_SECURITY_CHECK}
    ports:
      - "${FLOWISE_PORT}:${FLOWISE_PORT}"
    volumes:
      - flowise_data:/root/.flowise
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    command: start
    environment:
      - GENERIC_TIMEZONE=${N8N_TIMEZONE}
      - TZ=${N8N_TIMEZONE}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - WEBHOOK_URL=${N8N_PUBLIC_URL}
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL}
    volumes:
      - n8n_data:/home/node/.n8n

##################################  Fleet Compose Configuration  ###################################################
# El siguiente fragmento de compose es un copy/paste del proporcionado oficialmente por fleets
  mysql:
    image: mysql:8
    platform: linux/x86_64
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    cap_add:
      - SYS_NICE
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "3306:3306"
    restart: unless-stopped

  redis:
    image: redis:6
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "6379:6379"
    restart: unless-stopped

  fleet-init:
    image: alpine:latest
    volumes:
      - logs:/logs
      - data:/data
      - vulndb:/vulndb
    command: sh -c "chown -R 100:101 /logs /data /vulndb"

  fleet:
    image: fleetdm/fleet
    platform: linux/x86_64
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    command: sh -c "/usr/bin/fleet prepare db --no-prompt && /usr/bin/fleet serve"
    environment:
      # In-cluster service addresses (no hostnames/ports on the host)
      - FLEET_REDIS_ADDRESS=redis:6379
      - FLEET_MYSQL_ADDRESS=mysql:3306
      - FLEET_MYSQL_DATABASE=${MYSQL_DATABASE}
      - FLEET_MYSQL_USERNAME=${MYSQL_USER}
      - FLEET_MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # Fleet HTTP listener
      - FLEET_SERVER_ADDRESS=${FLEET_SERVER_ADDRESS}:${FLEET_SERVER_PORT}
      - FLEET_SERVER_TLS=${FLEET_SERVER_TLS}
      # TLS Certificate paths (only needed if FLEET_SERVER_TLS=true)
      - FLEET_SERVER_CERT=${FLEET_SERVER_CERT}
      - FLEET_SERVER_KEY=${FLEET_SERVER_KEY}
      # Secrets
      - FLEET_SERVER_PRIVATE_KEY=${FLEET_SERVER_PRIVATE_KEY} # Run 'openssl rand -base64 32' to generate
      - FLEET_LICENSE_KEY=${FLEET_LICENSE_KEY}
      # System tuning & other options
      - FLEET_SESSION_DURATION=${FLEET_SESSION_DURATION}
      - FLEET_LOGGING_JSON=${FLEET_LOGGING_JSON}
      - FLEET_OSQUERY_STATUS_LOG_PLUGIN=${FLEET_OSQUERY_STATUS_LOG_PLUGIN}
      - FLEET_FILESYSTEM_STATUS_LOG_FILE=${FLEET_FILESYSTEM_STATUS_LOG_FILE}
      - FLEET_FILESYSTEM_RESULT_LOG_FILE=${FLEET_FILESYSTEM_RESULT_LOG_FILE}
      - FLEET_OSQUERY_LABEL_UPDATE_INTERVAL=${FLEET_OSQUERY_LABEL_UPDATE_INTERVAL}
      - FLEET_VULNERABILITIES_CURRENT_INSTANCE_CHECKS=${FLEET_VULNERABILITIES_CURRENT_INSTANCE_CHECKS}
      - FLEET_VULNERABILITIES_DATABASES_PATH=${FLEET_VULNERABILITIES_DATABASES_PATH}
      - FLEET_VULNERABILITIES_PERIODICITY=${FLEET_VULNERABILITIES_PERIODICITY}
    ports:
      - "${FLEET_SERVER_PORT}:${FLEET_SERVER_PORT}" # UI/API
    volumes:
      - data:/fleet
      - logs:/logs
      - vulndb:${FLEET_VULNERABILITIES_DATABASES_PATH}
      - ./certs/fleet.crt:/fleet/fleet.crt:ro
      - ./certs/fleet.key:/fleet/fleet.key:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:${FLEET_SERVER_PORT}/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  fleetctl:
    build:
      context: ./fleetctl
    profiles: ["setup"]
    restart: "no"
    depends_on:
      fleet:
        condition: service_healthy
    environment:
      # Setup Dirección interna hacia Fleet (Docker container)
      FLEET_ADDRESS: https://fleet:${FLEET_SERVER_PORT}

      # Login
      FLEET_ORG_NAME: ${FLEET_ORG_NAME}
      FLEET_ADMIN_NAME: ${FLEET_ADMIN_NAME}
      FLEET_ADMIN_EMAIL: ${FLEET_ADMIN_EMAIL}
      FLEET_ADMIN_PASSWORD: ${FLEET_ADMIN_PASSWORD}

      # Enrollment (hosts)
      FLEET_ENROLL_SECRET: ${FLEET_ENROLL_SECRET}
      FLEET_ENROLL_URL: https://${FLEET_HOST}:${FLEET_SERVER_PORT}

      # Nombre del instalador de salida
      INSTALLER_NAME: ${INSTALLER_NAME}

      # Flags para generar instaladores
      GENERATE_MSI: ${GENERATE_MSI}
      GENERATE_DEB: ${GENERATE_DEB}
      GENERATE_RPM: ${GENERATE_RPM}
      GENERATE_PKG: ${GENERATE_PKG}
    volumes:
      - ./instaladores:/out
